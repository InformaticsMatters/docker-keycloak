---
name: build

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  # Allow a user to start a build from the Actions tab
  workflow_dispatch:
  schedule:
  # Weekly build at 20:55 on Sundays
  - cron: 55 20 * * SUN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          tags: ${{ github.repository_owner }}/keycloak:latest
      - name: Smoke test
        run: ./test/smoke-test.sh "$(sed -n 's/^ARG KEYCLOAK_VERSION=//p' Dockerfile)"
